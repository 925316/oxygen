name: sweep

# Full pass over all 4,294,967,296 seeds (2^32), in resumable blocks.
#
# A block is `shards x seeds_per_shard` seeds starting at `.sweep/state.json`'s
# `next`. After the block the `advance` job keeps the longest contiguous prefix
# that was fully scanned and moves `next` there, so the next run continues
# exactly where this one stopped. A shard that runs out of wall clock still
# writes its results and reports the seed it stopped at; the block is then
# retried from the first unreached seed next run. No seed is skipped on purpose.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: Parallel shards (one job each, max 80)
        required: true
        default: "80"
      seeds_per_shard:
        description: Seeds each shard tries to cover in one block
        required: true
        default: "100000"
      threads:
        description: Worker threads per shard
        required: true
        default: "4"
      time_budget:
        description: Hard wall clock per shard, minutes (job timeout is 350)
        required: true
        default: "300"

concurrency:
  group: sweep
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "1"
  NODE_OPTIONS: "--max-old-space-size=3072"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: Build the shard matrix
        id: m
        run: |
          n=${{ inputs.shards }}
          if [ "$n" -lt 1 ] || [ "$n" -gt 80 ]; then
            echo "::error::shards must be between 1 and 80, got $n"
            exit 1
          fi
          echo "matrix={\"index\":[$(seq -s, 0 $((n - 1)))]}" >> "$GITHUB_OUTPUT"

  scan:
    name: shard ${{ matrix.index }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve this shard's slice of the current block
        id: slice
        env:
          CI_SPAN: ${{ inputs.seeds_per_shard }}
          CI_SHARDS: ${{ inputs.shards }}
          CI_INDEX: ${{ matrix.index }}
        run: node scripts/ci-sweep.cjs range >> "$GITHUB_OUTPUT"

      - name: Scan shard
        if: steps.slice.outputs.empty != 'true'
        env:
          CI_FROM: ${{ steps.slice.outputs.from }}
          CI_TO: ${{ steps.slice.outputs.to }}
          CI_THREADS: ${{ inputs.threads }}
          CI_FILTER_FILE: config/default-filter.json
          CI_OUTPUT: out/shard.json
          CI_TIME_BUDGET_MIN: ${{ inputs.time_budget }}
        run: node scripts/ci-scan.cjs shard --index 0 --shards 1

      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.index }}
          path: out/shard.json
          if-no-files-found: warn
          retention-days: 14

  advance:
    name: merge and move the boundary
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: shard-*

      - name: Flatten shards
        run: |
          mkdir -p flat
          find shards -name 'shard.json' -exec sh -c 'mv "$1" "flat/$(basename "$(dirname "$1")").json"' _ {} \;

      - name: Merge
        run: node scripts/ci-scan.cjs merge --inputs flat --output out/hits.json --lang en

      - name: Build report
        run: node scripts/ci-report.cjs --input out/hits.json --output out/summary.md --lang en

      - name: Move the boundary
        run: node scripts/ci-sweep.cjs advance --shards flat

      - name: Publish run summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit the new state
        run: |
          git config user.name "sweep-bot"
          git config user.email "sweep-bot@users.noreply.github.com"
          git add .sweep
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          next=$(node -p "require('./.sweep/state.json').next")
          git commit -m "sweep: advance to $next"
          git push origin HEAD:state

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ github.run_number }}
          path: |
            out/hits.json
            out/summary.md
          retention-days: 14
